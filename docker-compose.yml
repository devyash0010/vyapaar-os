
version: '3.8'

services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/vyapaar_core
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-production_secret_key_93847298347}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  web:
    build: 
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  mongodb:
    image: mongo:6.0-jammy
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - vyapaar_mongo_data:/data/db

  redis:
    image: redis:7.0-alpine
    restart: always
    ports:
      - "6379:6379"

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  vyapaar_mongo_data:
  n8n_data: