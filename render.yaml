services:
  # FastAPI Backend Service
  - type: web
    name: vyapaar-os-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_NAME
        value: vyapaar_core
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: ALLOWED_HOSTS
        value: "*"

  # React Frontend Static Site
  - type: web
    name: vyapaar-os-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vyapaar-os-backend
          property: host

